# Beta test version v1.2.0
# ipp-usb configuration
# https://github.com/OpenPrinting/ipp-usb

[main]
  # TCP port range for IPP-over-USB proxy endpoints
  # Each USB printer gets a port in this range
  port = 60000:60010

  # Where ipp-usb state/socket files are kept
  # (mapped to Docker volume ipp-usb-state)
  state-dir = /var/ipp-usb

[logging]
  # Log to console (captured by Docker)
  console-log-level = info

  # Disable file logging inside container
  max-file-size = 0
