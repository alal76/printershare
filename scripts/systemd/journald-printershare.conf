# PrinterShare — bounds on-disk journal growth.
#
# Debian's default journald.conf leaves SystemMaxUse unset, which can let
# the journal grow to a large fraction of the filesystem over time — a
# real risk on a small LXC container's disk. The portal's own structured
# logs (server/lib/logger.js) go through the journal like everything else,
# so this cap applies to them too.
#
# Installed to /etc/systemd/journald.conf.d/printershare.conf by
# scripts/install-native.sh and scripts/proxmox/install.sh.
[Journal]
SystemMaxUse=200M
MaxRetentionSec=2week
