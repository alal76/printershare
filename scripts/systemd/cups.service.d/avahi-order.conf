# PrinterShare — cups.service ships with no ordering dependency on
# avahi-daemon.service, so both start in parallel at boot with no
# guarantee about which comes up first. CUPS registers its AirPrint/IPP
# DNS-SD records with avahi once, at startup, and does not retry — if
# cupsd wins the race and starts before avahi-daemon's socket is ready,
# that registration silently fails and the printer never becomes
# discoverable (iOS/macOS AirPrint, Windows/Android IPP-Everywhere
# discovery) until something manually restarts cups.
#
# Installed to /etc/systemd/system/cups.service.d/avahi-order.conf by
# scripts/install-native.sh and scripts/proxmox/install.sh.
[Unit]
After=avahi-daemon.service
Wants=avahi-daemon.service
