# Beta test version v1.2.0
# Nginx reverse proxy for printershare
#
# Routes:
#   /           → portal (Vue SPA + API)          :3000
#   /scan/      → scanservjs (SANE scanner UI)     :8080
#   /docs/      → paperless-ngx (optional profile) :8000
#   /cups/      → CUPS admin UI (host network)     host:631
#   /health     → nginx stub 200

limit_req_zone $binary_remote_addr zone=cups_admin:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 200M;
    # Use Docker's embedded DNS so upstream hostnames are resolved lazily
    # (allows nginx to start even if an upstream is temporarily down, and
    # avoids caching stale IPs across container recreates).
    resolver 127.0.0.11 valid=30s ipv6=off;
    # ── Security headers ─────────────────────────────────────────
    add_header X-Frame-Options       SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff   always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── Portal API ───────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        set $upstream_portal http://ps-portal:3000;
        proxy_pass         $upstream_portal;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Scanservjs web UI + WebSocket ────────────────────────────
    location /scan/ {
        set $upstream_scan http://ps-scanservjs:8080;
        # When proxy_pass uses a variable, nginx does NOT auto-strip the
        # location prefix.  Rewrite explicitly so /scan/api/v1/... reaches
        # scanservjs at /api/v1/...  (otherwise POSTs return 404).
        rewrite            ^/scan/(.*)$ /$1 break;
        proxy_pass         $upstream_scan;
        proxy_http_version 1.1;

        # WebSocket support for scan progress (socket.io)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Paperless-ngx document management ────────────────────────
    location /docs/ {
        set $paperless http://ps-paperless:8000;
        proxy_pass         $paperless/docs/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── CUPS admin UI at /cups/ ──────────────────────────────────
    location /cups/ {
        limit_req zone=cups_admin burst=10 nodelay;
        proxy_pass         http://host.docker.internal:631/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_redirect     http://host.docker.internal:631/ /cups/;
    }

    # ── Health check ─────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Portal (Vue SPA — catch-all) ─────────────────────────────
    location / {
        set $upstream_portal_root http://ps-portal:3000;
        proxy_pass         $upstream_portal_root;
        proxy_http_version 1.1;

        # WebSocket support for SSE build log streaming
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
