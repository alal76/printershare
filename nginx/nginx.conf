# Nginx reverse proxy for printershare
# Port 80  ->  Scanservjs web UI
# /cups/   ->  CUPS admin (host:631)

limit_req_zone $binary_remote_addr zone=cups_admin:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    # ── Scanservjs web UI ────────────────────────────────────────
    location / {
        proxy_pass         http://ps-scanservjs:8080;
        proxy_http_version 1.1;

        # WebSocket support (scanservjs uses socket.io for live preview)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        client_max_body_size  200M;
    }

    # ── CUPS admin UI at /cups/ ──────────────────────────────────
    location /cups/ {
        limit_req zone=cups_admin burst=10 nodelay;
        proxy_pass         http://host.docker.internal:631/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_redirect     http://host.docker.internal:631/ /cups/;
    }

    # ── Health check ─────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
