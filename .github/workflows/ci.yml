name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint + type-check + unit tests ─────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        working-directory: portal
        run: npm ci

      - name: Lint
        working-directory: portal
        run: npm run lint

      - name: Type-check
        working-directory: portal
        run: npm run type-check

      - name: Unit tests (client + server)
        working-directory: portal
        run: npm run test:ci

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: portal/coverage/

  # ── Build Docker image to verify Dockerfile is valid ───────────────────
  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build portal image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./portal
          push: false
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── E2E tests (only on push to main, not on PRs to save minutes) ────────
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        working-directory: portal
        run: npm ci

      - name: Build portal
        working-directory: portal
        run: npm run build

      - name: Install Playwright browsers
        working-directory: portal
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: portal
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: portal/playwright-report/
