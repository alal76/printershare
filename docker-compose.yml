version: "3.8"

# ═══════════════════════════════════════════════════════════════════
#  printershare — USB Printer + Scanner LAN Share Stack
#
#  Default services (always started):
#    portal      Web UI + API                 http://<HOST>/
#    cups        CUPS print server            http://<HOST>/cups/
#    ipp-usb     IPP-over-USB proxy (AirPrint/AirScan)
#    scanservjs  Scanner backend              http://<HOST>/scan/
#    samba       SMB/CIFS share              \\<HOST>\Scans
#    nfs         NFS share                   <HOST>:/exports/scans
#    nginx       Reverse proxy               http://<HOST>:80
#
#  Optional profiles:
#    docs        Paperless-ngx DMS            http://<HOST>/docs/
#    remote      Tailscale VPN + Cloudflare tunnel
#
#  Quick start:
#    make wizard    # browser-based setup wizard
#    make setup && make build && make start
#
#  Enable optional services:
#    COMPOSE_PROFILES=docs,remote make start
# ═══════════════════════════════════════════════════════════════════

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  ps-network:
    name: ps-network

services:

  # ── Portal ─────────────────────────────────────────────────────
  # Single-page Vue 3 app + Express API — unified web entry point
  portal:
    build:
      context: ./portal
    container_name: ps-portal
    restart: unless-stopped
    networks:
      - ps-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.env:/config/.env
      - ./docker-compose.yml:/config/docker-compose.yml:ro
      - ${SCANS_HOST_PATH:-/srv/printershare/scans}:/scans:ro
      - portal-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV:            production
      PORT:                3000
      CUPS_HOST:           host.docker.internal
      CUPS_PORT:           ${CUPS_PORT:-631}
      SCANSERVJS_INTERNAL: http://ps-scanservjs:8080
      PAPERLESS_INTERNAL:  http://ps-paperless:8000
      DOTENV_PATH:         /config/.env
      COMPOSE_FILE:        /config/docker-compose.yml
      SCANS_PATH:          /scans
      PORTAL_AUTH:         ${PORTAL_AUTH:-false}
      PORTAL_SECRET:       ${PORTAL_SECRET:-changeme-portal-secret}
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ── CUPS ───────────────────────────────────────────────────────
  # network_mode: host so Avahi/mDNS Bonjour reaches the LAN
  cups:
    build:
      context: ./cups
    container_name: ps-cups
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    volumes:
      - cups-config:/etc/cups
      - cups-ppd:/usr/share/cups/model
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      CUPSADMIN:    ${CUPS_ADMIN_USER:-admin}
      CUPSPASSWORD: ${CUPS_ADMIN_PASS:-changeme}
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:631/"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ── ipp-usb ────────────────────────────────────────────────────
  # IPP-over-USB proxy: makes USB printers/scanners speak IPP/eSCL
  # Enables AirPrint, Mopria, and AirScan/eSCL natively on clients
  ipp-usb:
    image: openprinting/ipp-usb:latest
    container_name: ps-ipp-usb
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /var/run/dbus:/var/run/dbus
      - ipp-usb-state:/var/ipp-usb
      - ./ipp-usb/ipp-usb.conf:/etc/ipp-usb/ipp-usb.conf:ro
    logging: *default-logging

  # ── Scanservjs ─────────────────────────────────────────────────
  # SANE-based scanner backend; portal wraps its API + WebSocket
  scanservjs:
    build:
      context: ./scanservjs
    container_name: ps-scanservjs
    restart: unless-stopped
    networks:
      - ps-network
    cap_add:
      - NET_ADMIN
    volumes:
      - ${SCANS_HOST_PATH:-/srv/printershare/scans}:/app/data/output
      - ./scanservjs/config.js:/app/config/config.js:ro
      - rclone-config:/root/.config/rclone
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      RCLONE_GDRIVE_REMOTE:   ${RCLONE_GDRIVE_REMOTE:-gdrive}
      RCLONE_ONEDRIVE_REMOTE: ${RCLONE_ONEDRIVE_REMOTE:-onedrive}
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ── Samba ──────────────────────────────────────────────────────
  # Windows: \\<HOST>\Scans   macOS: smb://<HOST>/Scans
  samba:
    image: dperson/samba:latest
    container_name: ps-samba
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${SCANS_HOST_PATH:-/srv/printershare/scans}:/scans
    environment:
      USERID:  "1000"
      GROUPID: "1000"
    command: >-
      -s "Scans;/scans;yes;no;yes;all;;;Scanned documents"
      -u "${SAMBA_USER:-scanner};${SAMBA_PASS:-changeme}"
      -p
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ── NFS ────────────────────────────────────────────────────────
  # Linux/macOS: mount <HOST>:/exports/scans
  nfs:
    image: erichough/nfs-server:latest
    container_name: ps-nfs
    restart: unless-stopped
    privileged: true
    networks:
      - ps-network
    ports:
      - "2049:2049"
      - "111:111/tcp"
      - "111:111/udp"
    volumes:
      - ${SCANS_HOST_PATH:-/srv/printershare/scans}:/exports/scans
      - ./nfs/exports:/etc/exports:ro
    logging: *default-logging

  # ── Nginx ──────────────────────────────────────────────────────
  # Single entry point:
  #   /         → portal (Vue SPA + API)
  #   /scan/    → scanservjs
  #   /docs/    → paperless-ngx (profile: docs)
  #   /cups/    → CUPS admin
  nginx:
    image: nginx:alpine
    container_name: ps-nginx
    restart: unless-stopped
    networks:
      - ps-network
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/tls:/etc/nginx/tls:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    depends_on:
      - portal
      - scanservjs

  # ── Paperless-ngx (profile: docs) ─────────────────────────────
  # OCR document management system; scans auto-consumed from /scans
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: ps-paperless
    restart: unless-stopped
    profiles:
      - docs
    networks:
      - ps-network
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - ${SCANS_HOST_PATH:-/srv/printershare/scans}:/usr/src/paperless/consume:ro
    environment:
      PAPERLESS_DBENGINE:             postgresql
      PAPERLESS_DBHOST:               ps-paperless-db
      PAPERLESS_DBPORT:               5432
      PAPERLESS_DBNAME:               paperless
      PAPERLESS_DBUSER:               paperless
      PAPERLESS_DBPASS:               ${PAPERLESS_DB_PASS:-changeme-paperless}
      PAPERLESS_REDIS:                redis://ps-paperless-redis:6379
      PAPERLESS_SECRET_KEY:           ${PAPERLESS_SECRET_KEY:-changeme-paperless-secret}
      PAPERLESS_ADMIN_USER:           ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD:       ${PAPERLESS_ADMIN_PASS:-changeme}
      PAPERLESS_URL:                  http://localhost/docs
      PAPERLESS_FORCE_SCRIPT_NAME:    /docs
      PAPERLESS_STATIC_URL:           /docs/static/
      PAPERLESS_TIME_ZONE:            ${TZ:-UTC}
      PAPERLESS_OCR_LANGUAGE:         ${OCR_LANGUAGE:-eng}
      PAPERLESS_CONSUMER_POLLING:     60
    depends_on:
      - paperless-db
      - paperless-redis
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  paperless-db:
    image: postgres:16-alpine
    container_name: ps-paperless-db
    restart: unless-stopped
    profiles:
      - docs
    networks:
      - ps-network
    volumes:
      - paperless-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       paperless
      POSTGRES_USER:     paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASS:-changeme-paperless}
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  paperless-redis:
    image: redis:7-alpine
    container_name: ps-paperless-redis
    restart: unless-stopped
    profiles:
      - docs
    networks:
      - ps-network
    volumes:
      - paperless-redis:/data
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ── Tailscale VPN (profile: remote) ───────────────────────────
  # Allows printing/scanning from anywhere via WireGuard mesh VPN
  tailscale:
    image: tailscale/tailscale:latest
    container_name: ps-tailscale
    restart: unless-stopped
    profiles:
      - remote
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY:    ${TAILSCALE_AUTH_KEY:-}
      TS_EXTRA_ARGS: --advertise-tags=tag:printershare
      TS_STATE_DIR:  /var/lib/tailscale
    logging: *default-logging

  # ── Cloudflare Tunnel (profile: remote) ───────────────────────
  # Exposes the portal web UI over HTTPS without port forwarding
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ps-cloudflared
    restart: unless-stopped
    profiles:
      - remote
    networks:
      - ps-network
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  cups-config:
  cups-ppd:
  ipp-usb-state:
  rclone-config:
  portal-data:
  paperless-data:
  paperless-media:
  paperless-db:
  paperless-redis:
  tailscale-state:
